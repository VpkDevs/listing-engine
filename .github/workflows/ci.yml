name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test

      - name: Build all packages (without Replit env vars)
        run: pnpm run build

      - name: Verify FlipKit Pro production bundle
        run: |
          test -f artifacts/flipkit-pro/dist/public/index.html
          test -d artifacts/flipkit-pro/dist/public/assets
          ls -lh artifacts/flipkit-pro/dist/public/index.html artifacts/flipkit-pro/dist/public/assets
